name=KihMMS
version=0.1.0
author=Kih
maintainer=Kih
sentence=Send and receive MMS and SMS on ESP32 with a SIMCom A76xx 4G modem (A7670E/G/SA, LilyGO T-A7670), plus firmware updates over MMS (OTAMMS).
paragraph=MMS goes over PPP (the ESP32 does TCP itself), so it works even when the modem's own TCP stack is blocked by the SIM card. SMS in PDU mode with æøå, the GSM extension table and emoji, long SMS joined, nothing lost while busy (messages are stored on the SIM). OTAMMS: split, sign (HMAC-SHA256) and send a new program as MMS; the board stitches it together, checks it and restarts. No external libraries.
category=Communication
