name=KihMMS
version=0.3.0
author=Kih
maintainer=Kih
sentence=Send and receive MMS and SMS on ESP32 with a SIMCom A76xx 4G modem (A7670E/G/SA, LilyGO T-A7670), plus GNSS position.
paragraph=One object (KihMms) for SMS and MMS in and out: incoming MMS are fetched by themselves, the operator settings are found from the SIM card. MMS goes over PPP (the ESP32 does TCP itself), so it works even when the modem's own TCP stack is blocked by the SIM card. SMS in PDU mode with æøå, the GSM extension table and emoji, long SMS joined and split. GNSS position from the modem. No external libraries.
category=Communication
