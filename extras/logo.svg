<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-label="KihMMS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="konvolutt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff7a3d"/>
    </linearGradient>
    <linearGradient id="tekst" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe3ff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="640" height="200" rx="28" fill="url(#bg)"/>
  <!-- chip -->
  <g transform="translate(40 40)">
    <rect x="8" y="8" width="104" height="104" rx="14" fill="#2d3d5e" stroke="#5c7bb5" stroke-width="3"/>
    <g stroke="#8fb0e8" stroke-width="5" stroke-linecap="round">
      <line x1="30" y1="0" x2="30" y2="8"/><line x1="60" y1="0" x2="60" y2="8"/><line x1="90" y1="0" x2="90" y2="8"/>
      <line x1="30" y1="112" x2="30" y2="120"/><line x1="60" y1="112" x2="60" y2="120"/><line x1="90" y1="112" x2="90" y2="120"/>
      <line x1="0" y1="30" x2="8" y2="30"/><line x1="0" y1="60" x2="8" y2="60"/><line x1="0" y1="90" x2="8" y2="90"/>
      <line x1="112" y1="30" x2="120" y2="30"/><line x1="112" y1="60" x2="120" y2="60"/><line x1="112" y1="90" x2="120" y2="90"/>
    </g>
    <!-- envelope on the chip -->
    <rect x="24" y="36" width="72" height="50" rx="7" fill="url(#konvolutt)"/>
    <path d="M27 40 L60 66 L93 40" fill="none" stroke="#7a2e10" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <!-- radio waves -->
  <g fill="none" stroke="#5fd4ff" stroke-linecap="round">
    <path d="M178 72 A30 30 0 0 1 178 128" stroke-width="7"/>
    <path d="M196 56 A52 52 0 0 1 196 144" stroke-width="7" opacity="0.75"/>
    <path d="M214 40 A74 74 0 0 1 214 160" stroke-width="7" opacity="0.5"/>
  </g>
  <text x="262" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="74" font-weight="700" fill="url(#tekst)">Kih<tspan fill="#ffb347">MMS</tspan></text>
  <text x="265" y="152" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#9fb6dc">MMS · SMS · OTA for ESP32 + 4G</text>
</svg>
