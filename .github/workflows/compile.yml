# Compiles every example for ESP32 (and the LilyGO T-A7670 settings) on each push and pull request.
name: Compile examples

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fqbn:
          - esp32:esp32:esp32
          - esp32:esp32:esp32:PSRAM=enabled,PartitionScheme=default,FlashMode=qio
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.fqbn }}
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.0
          libraries: |
            - source-path: ./
          sketch-paths: |
            - examples
          enable-warnings-report: true
